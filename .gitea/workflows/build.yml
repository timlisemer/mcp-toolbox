name: Build and Push MCP Toolbox

on:
  workflow_dispatch:
    inputs:
      build_toolbox:
        description: 'Build MCP Toolbox'
        required: false
        default: false
        type: boolean

jobs:
  build_amd64:
    if: ${{ inputs.build_toolbox }}
    runs-on: linux-amd64
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v6

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v4

      - name: Login to Gitea Container Registry
        uses: https://github.com/docker/login-action@v4
        with:
          registry: gitea.local.yakweide.de
          username: ${{ gitea.repository_owner }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Build MCP Toolbox (linux/amd64)
        uses: https://github.com/docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          tags: gitea.local.yakweide.de/${{ gitea.repository_owner }}/mcp-toolbox-linux-amd64
          build-args: |
            NIXOS_CI_IMAGE=gitea.local.yakweide.de/${{ gitea.repository_owner }}/nixos-ci:latest
          secrets: |
            github_token=${{ secrets.ASTRAL_AI_REPO_TOKEN }}

      - name: Push MCP Toolbox (linux/amd64)
        run: docker push gitea.local.yakweide.de/${{ gitea.repository_owner }}/mcp-toolbox-linux-amd64

  build_arm64:
    if: ${{ inputs.build_toolbox }}
    runs-on: linux-arm64
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v6

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v4

      - name: Login to Gitea Container Registry
        uses: https://github.com/docker/login-action@v4
        with:
          registry: gitea.local.yakweide.de
          username: ${{ gitea.repository_owner }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Build MCP Toolbox (linux/arm64)
        uses: https://github.com/docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          pull: true
          tags: gitea.local.yakweide.de/${{ gitea.repository_owner }}/mcp-toolbox-linux-arm64
          build-args: |
            NIXOS_CI_IMAGE=gitea.local.yakweide.de/${{ gitea.repository_owner }}/nixos-ci:latest
          secrets: |
            github_token=${{ secrets.ASTRAL_AI_REPO_TOKEN }}

      - name: Push MCP Toolbox (linux/arm64)
        run: docker push gitea.local.yakweide.de/${{ gitea.repository_owner }}/mcp-toolbox-linux-arm64
