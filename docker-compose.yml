services:
  mcp-toolbox:
    build: .
    image: mcp-toolbox:latest
    container_name: mcp-toolbox
    restart: unless-stopped
    network_mode: host
    shm_size: "2gb"
    environment:
      - BLENDER_HOST=${BLENDER_HOST:-127.0.0.1}
      - BLENDER_PORT=${BLENDER_PORT:-9876}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
