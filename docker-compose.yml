services:
  mcp-toolbox:
    build: .
    image: mcp-toolbox:latest
    container_name: mcp-toolbox
    restart: unless-stopped
    environment:
      - BLENDER_HOST=${BLENDER_HOST:-host.docker.internal}
      - BLENDER_PORT=${BLENDER_PORT:-9876}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
